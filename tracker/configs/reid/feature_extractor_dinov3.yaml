# DINOv3 Feature Extractor Configuration
# 
# This configuration uses Meta's DINOv3-base model for person re-identification.
# DINOv3 provides robust 768-dimensional features learned via self-supervised learning.
#
# Key Features:
# - 224x224 square input (standard for DINOv3)
# - Pad-to-square preprocessing (preserves aspect ratio)
# - ImageNet normalization
# - 768-dim feature vectors
#
# Model Export:
#   First, export the model to ONNX using: python scripts/export_dinov3_to_onnx.py
#   Or enable PyTorch fallback mode for testing (slower, requires transformers library)

_target_: tracker.reid.feature_extractor_dinov3.FeatureExtractorDINOv3

batch_size: 8

cfg:
  # Model configuration
  model_name: 'facebook/dinov2-base'  # HuggingFace model ID (for PyTorch fallback)
  model_path: '${model_dir}/reid/dinov3_base_224.onnx'  # Path to ONNX model
  
  # Image preprocessing
  image_size: [224, 224]  # DINOv3 expects square inputs (224 or 384)
  pad_to_square: true     # Pad person crops to square (preserves aspect ratio)
  
  # Normalization (ImageNet statistics - DINOv3 standard)
  pixel_mean: [0.485, 0.456, 0.406]  # RGB order
  pixel_std: [0.229, 0.224, 0.225]   # RGB order
  pixel_norm: true
  
  # Runtime settings
  device: 'cuda'          # 'cuda' or 'cpu'
  verbose: false
  
  # PyTorch fallback (for testing without ONNX export)
  # Set to true to use PyTorch if ONNX model not found
  # Requires: pip install transformers torch
  use_pytorch_fallback: false
  
  # Performance settings
  optimal_batch_size: 8   # Optimal batch size for inference
  enable_batch_padding: true

# Expected Performance (DINOv3-base, 224x224):
# - ONNX/CUDA (GPU): ~8-12ms for batch of 4-8 detections
# - ONNX/CPU: ~40-60ms for batch of 4-8 detections
# - PyTorch/CUDA: ~15-20ms for batch of 4-8 detections (first run slower due to JIT)
#
# Feature Dimensions:
# - DINOv3-small: 384 dims
# - DINOv3-base: 768 dims (this config)
# - DINOv3-large: 1024 dims
# - DINOv3-giant: 1536 dims
#
# Model Variants (change model_name and model_path):
#   Small:  'facebook/dinov2-small'  → 'dinov3_small_224.onnx'
#   Base:   'facebook/dinov2-base'   → 'dinov3_base_224.onnx' (current)
#   Large:  'facebook/dinov2-large'  → 'dinov3_large_224.onnx'
#   Giant:  'facebook/dinov2-giant'  → 'dinov3_giant_224.onnx'
