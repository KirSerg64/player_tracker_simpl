# SAM3 with Text Prompt Enabled (No Detector Required)
_target_: tracker.segment.sam3_segmenter.Sam3Segmenter
batch_size: 1
cfg:
  model_type: "sam3"
  model_path: "facebook/sam3-vit-base"
  
  text_prompt: "person"
  use_text_prompt: true  # Enable text prompts - works without detector
  bpe_path: "sam3/sam3/assets/bpe_simple_vocab_16e6.txt.gz"
  has_presence_token: true
  geo_encoder_use_img_cross_attn: true
  strict_state_dict_loading: true
  async_loading_frames: false
  compile_model: true