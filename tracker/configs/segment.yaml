# Main config
device: cpu
video_buffer_size: 50
video_path: ""
target_fps: 15

defaults:
  # - detector: yolo_api
  # - reid: feature_extractor_tensorrt
  - segment: sam3_text  # Options: sam3, mobile_sam, sam3_text
  - _self_

modules: # Allows module-specific batch_size and other configuration
  detector: {batch_size: 1}
  segment: {batch_size: 1}  # Reduced from 8 to avoid context conflicts

# Path definitions
home_dir: "${oc.env:HOME}"
data_dir: "${project_dir}/data"
model_dir: "${project_dir}/pretrained_models"

experiment_name: "player_tracking"
project_dir: "${hydra:runtime.cwd}"

save_final_tracklets: true
save_video_with_tracklets: false
save_detection_results: true
save_frame_results: false
save_original_tracklets: true
overlay_video: false
save_to_aws: true
hydra:
  run:
    dir: "outputs/${experiment_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}"
    # dir: "outputs"